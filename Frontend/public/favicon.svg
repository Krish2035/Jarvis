<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001815" />
      <stop offset="70%" stop-color="#000c0a" />
      <stop offset="100%" stop-color="#000504" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Core Glow -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="506" height="506" x="3" y="3" rx="97" fill="none" stroke="#00ffea" stroke-width="2" stroke-opacity="0.25" />

  <!-- Outer Tech Hexagon Grid -->
  <g stroke="#00ffea" stroke-opacity="0.2" stroke-width="1.5" fill="none" transform="translate(256,256)">
    <polygon points="0,-210 182,-105 182,105 0,210 -182,105 -182,-105" />
    <polygon points="0,-185 160,-92.5 160,92.5 0,185 -160,92.5 -160,-92.5" stroke-dasharray="8 6" />
    <line x1="-210" y1="0" x2="210" y2="0" stroke-opacity="0.15" />
    <line x1="0" y1="-210" x2="0" y2="210" stroke-opacity="0.15" />
  </g>

  <!-- Segmented Outer Rotating Ring -->
  <g transform="translate(256, 256)" filter="url(#cyanGlow)">
    <circle r="145" fill="none" stroke="#00ffea" stroke-width="4" stroke-dasharray="120 30 60 40 90 20" stroke-opacity="0.8" />
    <circle r="125" fill="none" stroke="#004440" stroke-width="10" stroke-opacity="0.5" />
    <circle r="125" fill="none" stroke="#00ffea" stroke-width="3" stroke-dasharray="20 15 40 10" stroke-opacity="0.9" />
  </g>

  <!-- Reactor Arc Segments (8 Coils) -->
  <g transform="translate(256, 256)" stroke="#00ffea" fill="#00ffea" fill-opacity="0.12">
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(45)" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(90)" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(135)" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(180)" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(225)" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(270)" filter="url(#cyanGlow)" />
    <path d="M-15,-95 L15,-95 L10,-75 L-10,-75 Z" transform="rotate(315)" filter="url(#cyanGlow)" />
  </g>

  <!-- Inner Cyan Ring -->
  <circle cx="256" cy="256" r="65" fill="#000c0a" stroke="#00ffea" stroke-width="3" filter="url(#cyanGlow)" />
  
  <!-- Central Triangular / Hex Core -->
  <g transform="translate(256,256)" filter="url(#coreGlow)">
    <polygon points="0,-42 36,21 -36,21" fill="#00ffea" fill-opacity="0.25" stroke="#00ffea" stroke-width="2.5" />
    <circle r="18" fill="#00ffea" />
    <circle r="8" fill="#ffffff" />
  </g>

  <!-- Tech Markings & Typography -->
  <text x="256" y="445" font-family="'Orbitron', 'Segoe UI', monospace" font-size="20" font-weight="900" fill="#00ffea" letter-spacing="8" text-anchor="middle" filter="url(#cyanGlow)">
    JARVIS MK-VII
  </text>
  <text x="256" y="470" font-family="'Share Tech Mono', monospace" font-size="11" font-weight="600" fill="#00ffea" fill-opacity="0.6" letter-spacing="4" text-anchor="middle">
    NEURAL PWA CORE
  </text>
</svg>