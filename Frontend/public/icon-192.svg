<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001815" />
      <stop offset="70%" stop-color="#000c0a" />
      <stop offset="100%" stop-color="#000504" />
    </radialGradient>
    <filter id="glow192" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bgGlow192)" />
  <rect width="188" height="188" x="2" y="2" rx="38" fill="none" stroke="#00ffea" stroke-width="1.5" stroke-opacity="0.3" />
  
  <g transform="translate(96,96)" filter="url(#glow192)">
    <!-- Outer Ring -->
    <circle r="60" fill="none" stroke="#00ffea" stroke-width="2" stroke-dasharray="40 10 20 10" stroke-opacity="0.8" />
    <circle r="48" fill="none" stroke="#004440" stroke-width="4" stroke-opacity="0.6" />
    <circle r="48" fill="none" stroke="#00ffea" stroke-width="1.5" stroke-dasharray="10 8 15 5" />
    
    <!-- Coils -->
    <g stroke="#00ffea" fill="#00ffea" fill-opacity="0.2">
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(45)" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(90)" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(135)" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(180)" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(225)" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(270)" />
      <path d="M-6,-38 L6,-38 L4,-30 L-4,-30 Z" transform="rotate(315)" />
    </g>

    <!-- Inner Core -->
    <circle r="24" fill="#000c0a" stroke="#00ffea" stroke-width="2" />
    <polygon points="0,-16 14,8 -14,8" fill="#00ffea" fill-opacity="0.4" stroke="#00ffea" stroke-width="1.5" />
    <circle r="7" fill="#00ffea" />
    <circle r="3" fill="#ffffff" />
  </g>
