<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001815" />
      <stop offset="70%" stop-color="#000c0a" />
      <stop offset="100%" stop-color="#000504" />
    </radialGradient>
    <filter id="glow512" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGlow512)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00ffea" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Tech Hexagon Grid -->
  <g stroke="#00ffea" stroke-opacity="0.18" stroke-width="2" fill="none" transform="translate(256,256)">
    <polygon points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110" />
    <polygon points="0,-190 165,-95 165,95 0,190 -165,95 -165,-95" stroke-dasharray="10 8" />
    <line x1="-220" y1="0" x2="220" y2="0" stroke-opacity="0.2" />
    <line x1="0" y1="-220" x2="0" y2="220" stroke-opacity="0.2" />
  </g>

  <!-- Segmented Outer Rotating Ring -->
  <g transform="translate(256, 256)" filter="url(#glow512)">
    <circle r="150" fill="none" stroke="#00ffea" stroke-width="4" stroke-dasharray="120 30 60 40 90 20" stroke-opacity="0.85" />
    <circle r="130" fill="none" stroke="#004440" stroke-width="12" stroke-opacity="0.5" />
    <circle r="130" fill="none" stroke="#00ffea" stroke-width="3" stroke-dasharray="20 15 40 10" stroke-opacity="0.95" />
  </g>

  <!-- Coils -->
  <g transform="translate(256, 256)" stroke="#00ffea" fill="#00ffea" fill-opacity="0.15">
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(45)" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(90)" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(135)" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(180)" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(225)" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(270)" filter="url(#glow512)" />
    <path d="M-16,-100 L16,-100 L11,-78 L-11,-78 Z" transform="rotate(315)" filter="url(#glow512)" />
  </g>

  <!-- Inner Cyan Ring -->
  <circle cx="256" cy="256" r="68" fill="#000c0a" stroke="#00ffea" stroke-width="4" filter="url(#glow512)" />
  
  <!-- Central Triangular Core -->
  <g transform="translate(256,256)" filter="url(#glow512)">
    <polygon points="0,-44 38,22 -38,22" fill="#00ffea" fill-opacity="0.3" stroke="#00ffea" stroke-width="3" />
    <circle r="19" fill="#00ffea" />
    <circle r="8" fill="#ffffff" />
  </g>
</svg>
